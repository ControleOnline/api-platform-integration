services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true
    ControleOnline\:
        resource: '../../src/*'
        exclude: '../../src/{DependencyInjection,Entity,Resource,Migrations,Library,Message,EventSubscriber,Tests,Kernel.php}'
    ControleOnline\Repository\:
        resource: '../../src/Repository'
        tags: ['doctrine.repository_service']
    ControleOnline\Controller\:
        resource: '../../src/Controller'
        tags: ['controller.service_arguments']
    ControleOnline\Controller\iFood\iFoodController:
        arguments:
            $loggerService: '@ControleOnline\Service\LoggerService'
            $requestPayloadService: '@ControleOnline\Service\RequestPayloadService'
            $configService: '@ControleOnline\Service\ConfigService'
            $extraDataService: '@ControleOnline\Service\ExtraDataService'
            $entityManager: '@doctrine.orm.entity_manager'
        tags: ['controller.service_arguments']
    ControleOnline\Command\:
        resource: '../../src/Command'
        tags: ['console.command']
    ControleOnline\Filter\:
        resource: '../../src/Filter'
    ControleOnline\EventSubscriber\MessengerDoctrineConnectionSubscriber:
        class: ControleOnline\EventSubscriber\MessengerDoctrineConnectionSubscriber
        file: '../../src/EventSubscriber/MessengerDoctrineConnectionSubscriber.php'
    ControleOnline\Service\N8NService:
        arguments:
            $n8nClient: '@http_client.n8n'
    ControleOnline\Service\FirebaseCloudMessagingService:
        arguments:
            $projectId: '%env(string:FIREBASE_PROJECT_ID)%'
            $serviceAccountSource: '%env(string:FIREBASE_SERVICE_ACCOUNT)%'
            $projectDir: '%kernel.project_dir%'
    http_client.n8n:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        arguments:
            - { base_uri: '%env(N8N_WEBHOOK)%' }
